name: "Curioso da Internet IA — FASE 2 — Validação"

on:
  push:
    branches: ["main"]
    paths:
      - "FONTES/**"
      - "EVIDENCIAS/**"
      - "PESQUISAS/**"
      - "CONHECIMENTO/**"
      - "ENTIDADES/**"
      - "CONEXOES/**"
      - "GANCHOS/**"
      - "BANCO_DE_IDEIAS/**"
      - "scripts/validar_fase_2.py"
      - "tests/**"
      - "ESTRUTURA/LAYOUT-VALIDACAO-FASE-2.md"
      - "GOVERNANCA/GATE-FASE-2.md"
      - "GOVERNANCA/CARTA-FASE-2.md"
  pull_request:
    paths:
      - "FONTES/**"
      - "EVIDENCIAS/**"
      - "PESQUISAS/**"
      - "CONHECIMENTO/**"
      - "ENTIDADES/**"
      - "CONEXOES/**"
      - "GANCHOS/**"
      - "BANCO_DE_IDEIAS/**"
      - "scripts/validar_fase_2.py"
      - "tests/**"

jobs:
  validar-fase-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Testes unitários
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validação determinística
        shell: bash
        run: |
          set -o pipefail
          python scripts/validar_fase_2.py | tee fase2-validacao.json
      - name: Publicar evidência da validação
        uses: actions/upload-artifact@v5
        with:
          name: fase2-validacao
          path: fase2-validacao.json
          if-no-files-found: error
